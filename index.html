<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Document</title>
</head>
    <section class="content">
    <h1 class="title">Форма заявки на работу в зоопарке</h1>
    <p class="desc"><em>Пожалуйста,заполніте форму. Обязательные поля помечены *</em></p>
    
    <section class="contact">
        <fieldset class="contact__info">
            <legend class="info__title">Контактная информация</legend>
            <form class="form">
                <div class="form__item">
                    <label for="name" class="required-field" >Имя</label>
                    <input type="text" name="username" id="username" required>
                </div>
                <div class="form__item">
                    <label for="phone-number">Телефон</label>
                    <input type="tel" name="phone-number" id="phone-number">
                </div>
                <div class="form__item">
                    <label for="user-email" class="required-field">Email</label>
                    <input type="email" name="user-email" id="user-email" required>
                </div>

            </form>

        </fieldset>

    </section>

    <section class="personal">
        <fieldset class="personal__info">
            <legend class="personal__title">Персональная информация</legend>
            <form class="form">
                <div class="form__item">
                    <label for="user-age" class="required-field">Возраст</label>
                    <input type="number" name="user-age" id="userage" required>
                </div>
                <div class="form__item">
                    <label for="gender">Пол</label>
                    <select name="user-gender" id="user-gender">
                        <option value="Man">Мужчина</option>
                        <option value="Women">Женщина</option>
                    </select>
                </div>
                <div class="form__item">
                    <label for="user-traits">Перечислите<br>личные<br> качества</label>
                    <textarea name="user-traits" id="user-traits"></textarea>

                </div>

            </form>
        </fieldset>
    </section>

    <section class="animal">
        <fieldset class="fav-animal">
            <legend class="animal__title">Выберите ваших любимых животных</legend>
            <form class="form">
                <div class="checkbox__group">
                <div class="form__checkbox">
                    <input type="checkbox" name="zebra" id="zebra">
                    <label for="zebra">Зебра</label>
                </div>
                <div class="form__checkbox">
                    <input type="checkbox" name="cat" id="cat">
                    <label for="zebra">Кошак</label>
                </div>
                <div class="form__checkbox">
                    <input type="checkbox" name="anaconda" id="anaconda">
                    <label for="zebra">Анаконда</label>
                </div>
                <div class="form__checkbox">
                    <input type="checkbox" name="human" id="human">
                    <label for="zebra">Человек</label>
                </div>
                <div class="form__checkbox">
                    <input type="checkbox" name="elephant" id="elephant">
                    <label for="zebra">Слон</label>
                </div>
                <div class="form__checkbox">
                    <input type="checkbox" name="antilope" id="antilope">
                    <label for="zebra" id="antilope">Антилопа</label>
                </div>
                <div class="form__checkbox">
                    <input type="checkbox" name="pigeon" id="pigeon">
                    <label for="zebra">Голубь</label>
                </div>
                <div class="form__checkbox">
                    <input type="checkbox" name="crab" id="crab">
                    <label for="zebra">Краб</label>
                </div>
            </div>
                
            </form>
        </fieldset>
    </section>
    <input type="submit" name="send" id="submit" value="Отправить информацию">
    </section>

    

</body>

</html>
